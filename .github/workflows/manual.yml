name: Build

on:
  create:
    tags:
      - v*

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-24.04-arm builds the aarch64 Linux wheel natively instead of under QEMU.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    env:
       CIBW_BUILD_VERBOSITY: 1
       # The extension is built against the stable ABI (PyO3 "abi3-py39"), so a
       # single cp39 build produces a cp39-abi3 wheel that works on Python >= 3.9.
       CIBW_BUILD: "cp39-*"
       CIBW_SKIP: "*-win32 *-musllinux* *_i686"
       CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y && yum install -y openssl-devel perl-IPC-Cmd"
       CIBW_ARCHS_LINUX: "auto"
       CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - if: runner.os == 'Windows'
        run: |
            echo 'RUSTFLAGS=-Ctarget-feature=+crt-static' >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==4.3.5

      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'

      - name: Install maturin
        run: |
          python -m pip install "maturin>=1.7,<2.0"

      - name: Build sdist
        run: maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TWINE_PASSWORD }}
