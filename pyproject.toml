[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "etebase"
dynamic = ["version"]
description = "Python client library for Etebase"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Tom Hacohen", email = "tom@stosb.com" }]
keywords = ["etebase", "encryption", "sync", "end-to-end encryption"]
requires-python = ">=3.9"
dependencies = ["msgpack>=1.0.0"]

[project.urls]
Homepage = "https://github.com/etesync/etebase-py"

[tool.maturin]
module-name = "etebase.etebase_python"
python-packages = ["etebase"]
features = ["pyo3/extension-module"]
exclude = [
    { path = ".aider*", format = "sdist" },
    { path = ".aider*/**/*", format = "sdist" },
    { path = ".vim/**/*", format = "sdist" },
    { path = "etebase/__pycache__/**/*", format = "sdist" },
]
